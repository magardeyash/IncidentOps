# Development Profile — Uses In-Memory H2 Database with PostgreSQL Compatibility Mode
spring:
  application:
    name: incidentops-dev
  datasource:
    url: jdbc:h2:mem:incidentopsdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 86400000

github:
  api:
    base-url: https://api.github.com
    token: ""
  webhook:
    secret: default-webhook-secret-key-12345

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000
